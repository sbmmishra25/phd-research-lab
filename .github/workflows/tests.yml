name: tests
on: [push,pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r 08-hinglish-nlp/requirements.txt -r 10-predictive-maintenance/requirements.txt
      - run: pytest 08-hinglish-nlp/tests 10-predictive-maintenance/tests
